# Verifier Coverage Catalog — Elira code-agent (runtime plan Ph7.x)
#
# The single, code-grounded map of: criterion type -> verifier tool -> evidence shape
# -> what it closes -> what it must NOT close -> support status -> false-positive risk.
#
# SOURCE OF TRUTH is still the code (taskspec.py / criterion_closure.py / tools/_web.py /
# agent_loop.py); this file DESCRIBES that code as of the audit date below. It is not yet
# wired INTO the runtime — that is a proposed follow-up (see docs/VERIFIER_COVERAGE_CATALOG.md
# §Implementation plan). Every `code:` field cites where the behaviour lives so the catalog
# can be checked against the code and, later, generated from / used to test it.
#
# audited_at: 2026-07-07
# audited_commit: f20257c
# support: supported | partial | missing
#   supported = intent classified + verifier verdict + evidence match + regression test
#   partial   = works for a narrow shape; realistic phrasings fall through
#   missing   = criterion classifies as `generic` (or misclassifies) -> never verified

meta:
  intents:                # every intent _criterion_intent() can emit (taskspec.py:_criterion_intent)
    - report              # "опиши в отчёте …" — NOT a verifiable criterion, routed away
    - file_exists
    - file_not_exists
    - content_contains
    - content_not_contains
    - dom_contains        # +flag interaction (taskspec.py:_is_interaction)
    - viewport_layout
    - page_open
    - server_started
    - command_check       # +command_kind: typecheck|build|test|import|smoke|lint|any
    - generic             # no verifier -> stays unverified (honest)
  flags:
    interaction: "dom_contains criterion that needs a user action first (fill/click)"
    conditional: "optional ('если в проекте есть …') — never hard-fails; finalize -> skipped"
  record_pipeline: "tool result -> _verifier_verdict(tool,args,evidence,meta) -> _verdict_target_matches -> _verdict_outcome (confirm|fail|None); code: taskspec.py:CriteriaTracker.record"

categories:

  - id: local.fs.exists
    domain: local
    support: supported
    criterion_patterns: ["создана папка `X`", "файл `X` существует", "проект находится внутри `X`"]
    intent: file_exists
    verifier_tools: [path_exists]
    evidence_required: ["path_exists(path) ok=True (present)"]
    closes: [file_exists]
    does_not_close: [content_contains, dom_contains]
    notes: "bare dir names (`subnet-helper`, no dot/slash) ARE valid targets via _path_tokens_from_text. path_exists is NOT in BASE_TOOLS (compaction canary) — activatable ToolSpec; closure gate activates it deterministically."
    code: "taskspec.py:_verifier_verdict(path_exists); tools/_files.py:tool_path_exists"

  - id: local.fs.not_exists
    domain: local
    support: supported
    criterion_patterns: ["файл `X` удалён", "папки `X` больше нет"]
    intent: file_not_exists
    verifier_tools: [path_exists]
    evidence_required: ["path_exists(path) ok=False (absent) confirms"]
    closes: [file_not_exists]
    does_not_close: [file_exists]
    code: "taskspec.py:_verdict_outcome (existence confirm-only)"

  - id: remote.ssh.exists
    domain: remote
    support: supported
    criterion_patterns: ["файл `C:\\X\\y.txt` существует", "директория `C:\\X` существует"]
    intent: file_exists
    verifier_tools: [ssh_exists, ssh_read]
    evidence_required: ["ssh_exists present, OR a successful ssh_read (proves existence, NOT content)"]
    closes: [file_exists]
    does_not_close: [content_contains, file_not_exists]
    code: "taskspec.py:_verifier_verdict(ssh_exists|ssh_read)"

  - id: remote.ssh.not_exists
    domain: remote
    support: supported
    criterion_patterns: ["временный файл `X` удалён после cleanup"]
    intent: file_not_exists
    verifier_tools: [ssh_not_exists]
    evidence_required: ["ssh_not_exists ok=True (absent) confirms; STILL-present FAILS (asserts=absent)"]
    closes: [file_not_exists, cleanup.confirmed]
    does_not_close: [file_exists]
    notes: "ssh_not_exists is the only existence verdict that can FAIL (explicit cleanup assertion). A passive ssh_exists that happens to see the file leaves it unconfirmed, never failed."
    code: "taskspec.py:_verifier_verdict(ssh_not_exists); _verdict_outcome"

  - id: file.content.contains
    domain: file
    support: supported
    criterion_patterns: ["файл `X` содержит строку `pat`"]
    intent: content_contains
    verifier_tools: [ssh_assert_contains]
    evidence_required: ["file token intersect + pattern in criterion text"]
    closes: [content_contains]
    does_not_close: [file_exists, dom_contains]
    notes: "a multi-string 'contains lines: A,B,C' criterion is split one-per-string at derivation (_split_multi_target)."
    code: "taskspec.py:_verifier_verdict(ssh_assert_contains); _verdict_target_matches"

  - id: file.content.not_contains
    domain: file
    support: supported
    criterion_patterns: ["файл `X` не содержит `pat`"]
    intent: content_not_contains
    verifier_tools: [ssh_assert_not_contains]
    evidence_required: ["file token intersect + pattern"]
    closes: [content_not_contains]
    does_not_close: [dom_contains]
    code: "taskspec.py:_verifier_verdict(ssh_assert_not_contains)"

  - id: cli.command.succeeds
    domain: cli
    support: supported
    criterion_patterns: ["`npm run typecheck` проходит", "проект собирается (build)", "pytest проходит"]
    intent: command_check
    verifier_tools: [run_bash]
    evidence_required: ["run_bash exit_code==0 AND recognised command_kind (typecheck|build|test|import|smoke|lint)"]
    closes: [command_check]
    does_not_close: [dom_contains, "browser interaction", file_exists]
    limits: "only the FIRST green per key counts (ProgressEvaluator). A bare command with NO kind keyword (e.g. `node index.js`) is NOT a verdict."
    code: "taskspec.py:_run_bash_verdict; progress.py:_verify_pass_is_progress"

  - id: server.started
    domain: server
    support: supported
    criterion_patterns: ["dev server запускается через `run_server`", "порт 8080 слушает"]
    intent: server_started
    verifier_tools: [run_server, ssh_port_check]
    evidence_required: ["run_server returns actual_url/server_started in meta (a failed start is NOT a verdict), OR ssh_port_check LISTENING"]
    closes: [server_started]
    does_not_close: [dom_contains, page_open]
    code: "taskspec.py:_verifier_verdict(run_server|ssh_port_check)"

  - id: http.page_open
    domain: web
    support: supported
    criterion_patterns: ["страница открывается без ошибок", "url отдаёт 200"]
    intent: page_open
    verifier_tools: [http_api, browser]
    evidence_required: ["http_api 2xx, OR a browser render (a render proves page_open too)"]
    closes: [page_open]
    does_not_close: [dom_contains]           # HTTP 200 != visible text
    notes: "closure plan drops the http_api ask when a browser DOM check is already needed (browser subsumes page_open)."
    code: "taskspec.py:_verifier_verdict(http_api|browser); criterion_closure.py:missing_verifier_actions (minimality)"

  - id: browser.dom_contains
    domain: browser
    support: supported
    criterion_patterns: ["rendered DOM содержит текст `X`", "на первом экране видно `X`"]
    intent: dom_contains
    verifier_tools: [browser]
    evidence_required: ["browser render; ALL target tokens present in the rendered inner_text, BOUNDARY-anchored + punctuation/whitespace-insensitive (_norm_dom)"]
    closes: [dom_contains, page_open]
    does_not_close: [command_check]
    false_positive_risk: "RESOLVED — was an unanchored substring (a value prefix-matched a longer one, e.g. 192.168.88.1 in .10); now boundary-anchored, dots kept only between digits. See f20257c."
    negative: "grep/findstr/read_file/http_api NEVER yield dom_contains — only a real browser render does."
    code: "taskspec.py:_verdict_target_matches(dom_contains) + _norm_dom"

  - id: browser.interaction.fill_click_assert
    domain: browser
    support: partial
    criterion_patterns: ["browser interaction: после ввода `V` и нажатия `Btn` rendered DOM содержит `R`"]
    intent: dom_contains  # +interaction flag
    verifier_tools: [browser]
    evidence_required: ["browser(url, actions=[{fill,value},{click}]) — DOM AFTER the actions contains the RESULT token(s) only (input value + button are the action, not asserted)"]
    closes: [dom_contains]
    does_not_close: [command_check]
    negative: "a bundle grep / a node script printing the text does NOT close an interaction criterion — only a real post-interaction browser render."
    partial_reason: >
      Grammar is narrow: (a) interaction is recognised only when the criterion has a
      _DOM_CTX word (rendered/DOM/на экране); 'browser interaction: … показывает X' with
      NO such word classifies as `generic` and is never verified (live backup-form).
      (b) interaction_spec extracts ONE fill + ONE click only; multi-field / select /
      checkbox / empty-field sequences are unsupported (see browser.form.* below).
    code: "taskspec.py:_is_interaction, _dom_targets, interaction_spec; criterion_closure.py:_interaction_group_actions; tools/_web.py:_apply_action(fill|click|wait)"

  - id: browser.form.select_checkbox_assert
    domain: browser
    support: supported            # Batch B
    criterion_patterns:
      - "browser interaction: пустой `Job name` + `Validate` показывает `Job name required`"
      - "`nas-backup` + `Daily` + включённый `Encryption` + `Validate` показывает `Backup job valid`"
    intent: dom_contains          # +interaction flag
    verifier_tools: [browser]
    evidence_required:
      - "browser(url, actions=[{fill,value:''},{select,value},{check},{click}]) — the tool ACTUALLY performs the steps and returns the real post-interaction DOM; the RESULT token (after показывает/содержит) must be present (boundary-anchored)."
    closes: [dom_contains]
    grammar: >
      An interaction criterion asserting a result classifies as dom_contains even WITHOUT a
      rendered/DOM/на-экране word — but ONLY when it names a browser/page surface (the
      'browser interaction:'/страниц/форм form), so a file-write or CLI criterion that merely
      uses a fill/ввод cue isn't hijacked into browser-only. The target is the result token
      only; input value / option / checkbox / button are the ACTION. The verdict is
      positive-evidence — a real browser render of the post-action DOM AND the browser tool
      reports `interacted` (a real fill/select/check/click resolved and ran), so a plain
      render (no actions, or all locators missed) can't confirm it. The action summary is
      kept OUT of the matched evidence (only the real DOM is matched). grep/source-read/
      HTTP-200 never confirm it.
    limits: >
      Attribution residual (same inherent class as cli.output): `interacted` proves the
      actions RAN, not that the matched token was CAUSED by them — a form that statically
      renders the result token before any interaction could still confirm. Bounded, not
      eliminated; a before/after DOM diff would close it if a live case ever needs it.
    regression: "tests/test_taskspec.py: backup-form classify+confirm; live Playwright fill/select/check/click form test."
    code: "taskspec.py:_criterion_intent (interaction→dom_contains), _dom_targets, _is_interaction; tools/_web.py:_apply_action(fill|select|check|uncheck|click), _resolve_locator(check)"

  - id: cli.output.contains
    domain: cli
    support: supported            # Batch A
    criterion_patterns:
      - "`node index.js sample.log` выводит `INFO: 2`"
      - "запуск с исходным CSV выводит `OK: 1`"
    intent: command_output
    verifier_tools: [run_bash]
    evidence_required: ["run_bash stdout/stderr contains the expected text (boundary-anchored _norm_dom); if the criterion names a command, the run's command must contain it (normalised); ONE run closes several output criteria for the same command"]
    closes: [command_output]
    does_not_close: [file_exists, dom_contains]
    grammar: >
      output VERB (выводит/печатает/prints/outputs) + a NAMED runnable command (a runnable
      quoted token like `node index.js sample.log`) + a CONCRETE quoted expected token
      (no token → pass/fail check → command_check). The named command must actually be
      invoked: the run's script+args must match (interpreter/path/env/`bash -c` wrapper
      ignored, so `node ./index.js sample.log` ≡ `node index.js sample.log`), it must not be
      a different tool merely printing/reading the script (echo/cat/sed/awk/`python -c`), and
      positive confirms only on exit 0 (negative on exit != 0).
    limits: >
      A PROSE run description with NO named runnable command ('запуск с исходным CSV выводит
      `OK: 1`', or an abstract 'verifier видит `X`') is NOT command_output — it classifies
      `generic` (honest, unverifiable), because no run can be reliably bound to it without a
      named command. To make such a criterion verifiable, NAME the command
      (`node check.js inventory.csv` выводит `OK: 1`). This is a deliberate scope cut after
      an adversarial review found prose command-matching produced repeated false-confirms."
    negative: "grep/findstr/read_file do NOT prove command output (a pure bundle-grep run yields no verdict)."
    regression: "tests/test_taskspec.py: log-summarizer + csv-inventory exact-prompt output criteria close from one run."
    code: "taskspec.py:_criterion_intent(command_output), command_spec, _verifier_verdict(run_bash), _verdict_target_matches/_verdict_outcome(command_output); agent_loop.py run_bash record; criterion_closure.py:_command_group_actions"

  - id: cli.output.not_contains
    domain: cli
    support: missing
    criterion_patterns: ["вывод НЕ содержит `X`"]
    intent: generic              # a negative ('НЕ содержит') hits the _NEG_CTX branch → generic
    verifier_tools: [run_bash]
    evidence_required: ["expected text ABSENT from stdout/stderr"]
    closes: []
    missing_reason: "'вывод не содержит X' matches _NEG_CTX with no file → _criterion_intent returns generic (never reaches command_output). No absence-of-output matcher; no live case needed it."
    code: "GAP (deferred — no live case)"

  - id: cli.command.fails_with_output
    domain: cli
    support: supported            # Batch A
    criterion_patterns: ["`node index.js missing.log` выводит `File not found` и завершается с ошибкой"]
    intent: command_output       # +expect_nonzero flag
    verifier_tools: [run_bash]
    evidence_required: ["stdout/stderr contains expected text AND exit_code != 0"]
    closes: [command_output]
    grammar: "output cue + expected token + a failure cue (завершается с ошибкой / non-zero / падает / ненулевой) sets expect_nonzero."
    regression: "tests/test_taskspec.py: log-summarizer missing.log closes only on text + non-zero exit."
    code: "taskspec.py:command_spec(expect_nonzero); _verdict_outcome(command_output)"

  - id: project.scope.created_under
    domain: project
    support: supported
    criterion_patterns: ["проект находится именно внутри `subnet-helper`"]
    intent: file_exists
    verifier_tools: [path_exists]
    evidence_required: ["path_exists(subnet-helper) or path_exists(subnet-helper/package.json)"]
    closes: [file_exists]
    code: "taskspec.py:_EXIST_CTX (+ 'внутри'/'находится')"

  - id: project.scope.no_parent_changes
    domain: project
    support: partial
    criterion_patterns: ["родительский проект не изменён, кроме создания `X`"]
    intent: null             # routed to CONSTRAINTS at derivation, not a criterion
    verifier_tools: []
    evidence_required: []
    closes: []
    partial_reason: >
      By design: a verify-only run can't confirm 'nothing else changed' — routed to
      constraints (_is_scope_rule), so it never hangs as unverified. A real verifier would
      need a changed-paths / git-diff-scope check (not implemented).
    code: "taskspec.py:_is_scope_rule -> constraints"

  - id: cleanup.confirmed
    domain: remote
    support: supported
    criterion_patterns: ["после cleanup файл `X` отсутствует"]
    intent: file_not_exists
    verifier_tools: [ssh_not_exists]
    evidence_required: ["ssh_not_exists absent"]
    closes: [file_not_exists]
    notes: "Cleanup Barrier (criterion_closure.py:cleanup_barrier_violation) only REDIRECTS a premature delete of a path with still-OPEN criteria under it — it does NOT confirm this criterion."
    code: "taskspec.py:_verifier_verdict(ssh_not_exists); _verdict_outcome"

  - id: viewport_layout
    domain: browser
    support: supported
    criterion_patterns: ["страница адаптивна для mobile/desktop", "нет горизонтального скролла на mobile"]
    intent: viewport_layout
    verifier_tools: ["browser(viewport=…)"]
    evidence_required: ["measured no-horizontal-overflow at the tested width (meta.viewport.checked + no_hoverflow)"]
    closes: [viewport_layout]
    does_not_close: ["a plain render with NO viewport requested (viewport=None) — never measured, stays unconfirmed", "a mobile-width measurement for a `desktop` claim (and vice-versa) — width-bucket mismatch, attribution both directions"]
    width_bucket: "from EXPLICIT device keywords only (mobile/telefon vs desktop); NOT from prose 'NNpx' (those are CSS sizes, not viewport widths — Batch D review). both-named or neither → any width confirms."
    overflow_measure: "documentElement.scrollWidth <= documentElement.clientWidth + 1 (both scrollbar-exclusive — innerWidth would mask overflow up to the scrollbar width; Batch D review)."
    residual_limit: "(1) measures overflow at the set width, doesn't cross-check the DOM there IS the responsive layout (Batch B class). (2) a multi-width criterion ('mobile и desktop') is confirmed by whichever single width the model measured — closure steers to mobile (the stricter); we don't require both."
    code: "tools/_web.py:tool_browser(viewport)+_browser_render; taskspec.py:_verdict_target_matches/_verdict_outcome(viewport_layout), _viewport_target; criterion_closure.py:_action_for(viewport_layout)"

# ── Negative rules (invariants the verifier layer MUST keep) ─────────────────
negative_rules:
  - "grep / findstr (run_bash) is NOT a verdict (returns None)."
  - "local read_file / grep / glob / project_map close NOTHING (not in _verifier_verdict). path_exists is the only LOCAL existence verifier. NOTE asymmetry: ssh_read DOES prove file_exists, local read_file does NOT."
  - "ssh_read proves file_exists ONLY — never content_contains (need ssh_assert_contains)."
  - "http_api / HTTP 200 proves page_open ONLY — never dom_contains (visible text)."
  - "a browser render is the ONLY thing that yields dom_contains; matching is boundary-anchored (no value prefix false-match)."
  - "a green build/typecheck (command_check) does NOT close a dom_contains / interaction criterion."
  - "the model's final TEXT closes nothing — completion is decided only by verifier verdicts."
  - "a conditional criterion never hard-FAILS; unresolved -> skipped (n/a), excluded from the mandatory denominator."
  - "a criterion with no deterministic verifier stays `generic` -> unverified (honest partial), never auto-confirmed."

# ── Known false-positive risks ───────────────────────────────────────────────
false_positive_risks:
  - id: dom_prefix_match
    status: resolved
    note: "value prefix-matched a longer value; fixed by boundary-anchored _norm_dom (f20257c)."
  - id: conditional_over_match
    status: resolved
    note: "broad 'если существует/доступ' demoted mandatory criteria; cues narrowed (f23ddb0)."
  - id: command_check_any_kind
    status: accepted
    note: "a green typecheck confirms a generic 'все проверки проходят' (command_kind=any) — intended."
